<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Railmania</title>
  </head>
  <body>
    <main id="app">
      <section class="game-stage" aria-label="Railmania game">
        <div class="menu-title">
          <img
            class="menu-title__image"
            src="/src/assets/Railmania-Title.png"
            alt=""
            draggable="false"
          />
          <button
            class="menu-title__hitbox"
            type="button"
            aria-label="Bounce Railmania title"
            disabled
          ></button>
        </div>

        <nav class="menu-nav" aria-label="Main menu">
          <button class="menu-nav__item" type="button" data-action="new-game">
            <span class="menu-nav__text">New Game</span>
          </button>
          <button class="menu-nav__item" type="button" data-action="load-game">
            <span class="menu-nav__text">Load Game</span>
          </button>
          <button class="menu-nav__item" type="button" data-action="settings">
            <span class="menu-nav__text">Settings</span>
          </button>
          <button class="menu-nav__item" type="button" data-action="quit">
            <span class="menu-nav__text">Quit</span>
          </button>
        </nav>

        <section class="settings-panel" aria-label="Settings">
          <button class="settings-panel__back" type="button" aria-label="Back to main menu">
            <span class="settings-panel__back-text">← Back</span>
          </button>

          <h2 class="settings-panel__heading">Settings</h2>

          <div class="settings-panel__scroll">
            <div class="settings-panel__group settings-panel__group--toggle">
              <span class="settings-panel__label">Setting 1</span>
              <button class="settings-panel__toggle" type="button" role="switch" aria-checked="false" aria-label="Toggle setting 1">
                <span class="settings-panel__toggle-track"></span>
                <span class="settings-panel__toggle-thumb"></span>
              </button>
            </div>
            <div class="settings-panel__group settings-panel__group--toggle">
              <span class="settings-panel__label">Setting 2</span>
              <button class="settings-panel__toggle" type="button" role="switch" aria-checked="false" aria-label="Toggle setting 2">
                <span class="settings-panel__toggle-track"></span>
                <span class="settings-panel__toggle-thumb"></span>
              </button>
            </div>
            <div class="settings-panel__group settings-panel__group--toggle">
              <span class="settings-panel__label">Setting 3</span>
              <button class="settings-panel__toggle" type="button" role="switch" aria-checked="false" aria-label="Toggle setting 3">
                <span class="settings-panel__toggle-track"></span>
                <span class="settings-panel__toggle-thumb"></span>
              </button>
            </div>
            <div class="settings-panel__group settings-panel__group--toggle">
              <span class="settings-panel__label">Setting 4</span>
              <button class="settings-panel__toggle" type="button" role="switch" aria-checked="false" aria-label="Toggle setting 4">
                <span class="settings-panel__toggle-track"></span>
                <span class="settings-panel__toggle-thumb"></span>
              </button>
            </div>
            <div class="settings-panel__group settings-panel__group--toggle">
              <span class="settings-panel__label">Setting 5</span>
              <button class="settings-panel__toggle" type="button" role="switch" aria-checked="false" aria-label="Toggle setting 5">
                <span class="settings-panel__toggle-track"></span>
                <span class="settings-panel__toggle-thumb"></span>
              </button>
            </div>
            <div class="settings-panel__group settings-panel__group--toggle">
              <span class="settings-panel__label">Setting 6</span>
              <button class="settings-panel__toggle" type="button" role="switch" aria-checked="false" aria-label="Toggle setting 6">
                <span class="settings-panel__toggle-track"></span>
                <span class="settings-panel__toggle-thumb"></span>
              </button>
            </div>
            <div class="settings-panel__group settings-panel__group--toggle">
              <span class="settings-panel__label">Setting 7</span>
              <button class="settings-panel__toggle" type="button" role="switch" aria-checked="false" aria-label="Toggle setting 7">
                <span class="settings-panel__toggle-track"></span>
                <span class="settings-panel__toggle-thumb"></span>
              </button>
            </div>
            <div class="settings-panel__group settings-panel__group--toggle">
              <span class="settings-panel__label">Setting 8</span>
              <button class="settings-panel__toggle" type="button" role="switch" aria-checked="false" aria-label="Toggle setting 8">
                <span class="settings-panel__toggle-track"></span>
                <span class="settings-panel__toggle-thumb"></span>
              </button>
            </div>
            <div class="settings-panel__group settings-panel__group--toggle">
              <span class="settings-panel__label">Setting 9</span>
              <button class="settings-panel__toggle" type="button" role="switch" aria-checked="false" aria-label="Toggle setting 9">
                <span class="settings-panel__toggle-track"></span>
                <span class="settings-panel__toggle-thumb"></span>
              </button>
            </div>
            <div class="settings-panel__group settings-panel__group--toggle">
              <span class="settings-panel__label">Setting 10</span>
              <button class="settings-panel__toggle" type="button" role="switch" aria-checked="false" aria-label="Toggle setting 10">
                <span class="settings-panel__toggle-track"></span>
                <span class="settings-panel__toggle-thumb"></span>
              </button>
            </div>
          </div>
        </section>

        <footer class="menu-footer" aria-label="Game information">
          <span>Made by Gerrxt</span>
          <span id="app-version" class="menu-footer__version"></span>
        </footer>
      </section>
    </main>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
